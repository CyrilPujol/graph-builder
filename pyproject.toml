[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-builder"
version = "0.1.0"
description = "Interactive graph visualisation and editing with Pygame and NetworkX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["graph_builder", "graph_builder_lib", "tikz_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
