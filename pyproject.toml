[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-builder"
version = "0.1.0"
description = "Interactive graph visualisation and editing with Qt and NetworkX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "PySide6-Essentials>=6.8",
]

[tool.setuptools]
py-modules = ["graph_builder", "graph_builder_lib", "graph_builder_custom", "graph_builder_qt", "graph_builder_qt_canvas", "graph_style_ui", "graph_styles", "graph_info", "graph_layout", "standard_graphs", "tikz_export"]
