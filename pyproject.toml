[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-builder"
version = "1.0.0.31"
description = "Interactive graph visualisation and editing with Qt and NetworkX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "PySide6-Essentials>=6.8",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.15"]
solver = ["ortools>=9.12,<10"]

[tool.setuptools]
py-modules = ["graph_builder"]

[tool.setuptools.packages.find]
include = ["graph_builder_core", "graph_builder_core.*"]
