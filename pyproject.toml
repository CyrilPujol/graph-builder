[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-builder"
version = "0.1.1"
description = "Interactive graph visualisation and editing with Qt and NetworkX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "PySide6-Essentials>=6.8",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.15"]

[tool.setuptools]
py-modules = ["graph_builder", "graph_builder_lib", "tikz_export"]
packages = ["graph_builder_core"]
